openapi: 3.1.0
info:
  title: Aegira Metrics API
  version: 0.1.0
  description: Loss prevented vs false-positive cost and friction (BR-5).
  x-domain: mtr
  license:
    name: Proprietary
servers:
  - url: https://api.aegira.local
security:
  - apiKey: []
  - bearerAuth: []
tags:
  - name: Metrics
paths:
  /v1/metrics/overview:
    get:
      operationId: getOpsMetricsOverview
      tags: [Metrics]
      x-repository: OpsMetrics
      x-dynamodb:
        entityType: OPS_METRICS
        pkPatternTemplate: "METRICS#OVERVIEW"
        skPatternTemplate: METADATA
        pkPattern: entity
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
      responses:
        '200':
          description: Loss vs FP strip
          content:
            application/json:
              schema:
                $ref: ./metrics.schemas.yaml#/components/schemas/OpsMetricsResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/metrics/lift:
    get:
      operationId: getWeeklyLift
      tags: [Metrics]
      x-repository: WeeklyLift
      x-dynamodb:
        entityType: WEEKLY_LIFT
        pkPatternTemplate: "METRICS#LIFT"
        skPatternTemplate: METADATA
        pkPattern: entity
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
      responses:
        '200':
          description: Champion vs challenger weekly lift
          content:
            application/json:
              schema:
                $ref: ./metrics.schemas.yaml#/components/schemas/WeeklyLiftResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/metrics/disposition-mix:
    get:
      operationId: getDispositionMix
      tags: [Metrics]
      x-repository: DispositionMix
      x-dynamodb:
        entityType: DISPOSITION_MIX
        pkPatternTemplate: "METRICS#MIX"
        skPatternTemplate: METADATA
        pkPattern: entity
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
      responses:
        '200':
          description: Disposition mix
          content:
            application/json:
              schema:
                $ref: ./metrics.schemas.yaml#/components/schemas/DispositionMixResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth
