apis:
  identity:
    root: src/identity.yaml
  scoring:
    root: src/scoring.yaml
  cases:
    root: src/cases.yaml
  dispositions:
    root: src/dispositions.yaml
  entities:
    root: src/entities.yaml
  models:
    root: src/models.yaml
  experiments:
    root: src/experiments.yaml
  handoffs:
    root: src/handoffs.yaml
  care:
    root: src/care.yaml
  metrics:
    root: src/metrics.yaml
  audit:
    root: src/audit.yaml

extends:
  - recommended

rules:
  no-unused-components: off
  operation-4xx-response: warn
  info-license: off
  info-license-url: off
  tag-description: off
  operation-operationId: error
  operation-summary: off
  info-license-strict: off
  no-invalid-media-type-examples: off

theme:
  openapi:
    generateCodeSamples:
      languages: []
