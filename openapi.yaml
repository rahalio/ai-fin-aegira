openapi: 3.0.3
info:
  title: Aegira
  version: 0.1.0
  description: Fraud-operations workbench with champion/challenger scoring and investigator cases.
  x-product-slug: ai-fin-aegira
  x-source: ai-in-financial/ai-in-finance/
servers:
- url: https://api.example.com
tags:
- name: Scores
  description: Transaction scoring
- name: Cases
  description: Fraud cases
- name: Dispositions
  description: Investigator dispositions
- name: Entities
  description: Linked entities
- name: Models
  description: Model versions
- name: Experiments
  description: Challenger experiments
- name: Handoffs
  description: AML handoffs
paths:
  /v1/scores:
    post:
      operationId: scoreTransaction
      tags:
      - Scores
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoreEventRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelopeScoreEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/cases:
    get:
      operationId: listFraudCases
      tags:
      - Cases
      security: &id001
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelopeCase'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/cases/{caseId}:
    parameters:
    - $ref: '#/components/parameters/CaseId'
    get:
      operationId: getFraudCase
      tags:
      - Cases
      security: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelopeCase'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/cases/{caseId}/dispositions:
    parameters:
    - $ref: '#/components/parameters/CaseId'
    post:
      operationId: createDisposition
      tags:
      - Dispositions
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispositionCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelopeDisposition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/cases/{caseId}/entities:
    parameters:
    - $ref: '#/components/parameters/CaseId'
    get:
      operationId: listCaseEntities
      tags:
      - Entities
      security: *id001
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelopeEntityLink'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/models:
    get:
      operationId: listFraudModels
      tags:
      - Models
      security: *id001
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelopeModelVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/experiments:
    get:
      operationId: listChallengerExperiments
      tags:
      - Experiments
      security: *id001
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelopeChallengerExperiment'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createChallengerExperiment
      tags:
      - Experiments
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengerExperimentCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelopeChallengerExperiment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/aml-handoffs:
    post:
      operationId: createAmlHandoff
      tags:
      - Handoffs
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmlHandoffCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelopeAmlHandoff'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Unprocessable entity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ResponseMeta:
      type: object
      required:
      - requestId
      - timestamp
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    Problem:
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    ScoreEvent:
      type: object
      required:
      - id
      - transactionRef
      - modelVersionId
      - score
      - decision
      properties:
        id:
          type: string
        transactionRef:
          type: string
        modelVersionId:
          type: string
        score:
          type: number
        decision:
          type: string
          enum:
          - allow
          - step_up
          - decline
          - case
        latencyMs:
          type: integer
    ScoreEventRequest:
      type: object
      required:
      - transactionRef
      - amount
      - currency
      properties:
        transactionRef:
          type: string
        amount:
          type: number
        currency:
          type: string
        merchantId:
          type: string
        deviceId:
          type: string
        features:
          type: object
          additionalProperties: true
    Case:
      type: object
      required:
      - id
      - scoreEventId
      - status
      properties:
        id:
          type: string
        scoreEventId:
          type: string
        priority:
          type: integer
        status:
          type: string
          enum:
          - open
          - investigating
          - closed
        slaDueAt:
          type: string
          format: date-time
    Disposition:
      type: object
      required:
      - id
      - caseId
      - code
      properties:
        id:
          type: string
        caseId:
          type: string
        code:
          type: string
          enum:
          - fraud_confirmed
          - friendly_fraud
          - false_positive
          - unable_to_determine
        notes:
          type: string
        analystId:
          type: string
    DispositionCreate:
      type: object
      required:
      - code
      properties:
        code:
          type: string
          enum:
          - fraud_confirmed
          - friendly_fraud
          - false_positive
          - unable_to_determine
        notes:
          type: string
    EntityLink:
      type: object
      required:
      - id
      - entityType
      - entityId
      - caseId
      properties:
        id:
          type: string
        entityType:
          type: string
          enum:
          - device
          - payee
          - merchant
        entityId:
          type: string
        caseId:
          type: string
    ModelVersion:
      type: object
      required:
      - id
      - name
      - role
      - status
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
          enum:
          - champion
          - challenger
        status:
          type: string
          enum:
          - shadow
          - limited
          - production
          - retired
    ChallengerExperiment:
      type: object
      required:
      - id
      - challengerModelId
      - status
      properties:
        id:
          type: string
        challengerModelId:
          type: string
        trafficPct:
          type: number
        status:
          type: string
          enum:
          - running
          - completed
          - aborted
        liftSummary:
          type: string
    ChallengerExperimentCreate:
      type: object
      required:
      - challengerModelId
      - trafficPct
      properties:
        challengerModelId:
          type: string
        trafficPct:
          type: number
    AmlHandoff:
      type: object
      required:
      - id
      - caseId
      - status
      properties:
        id:
          type: string
        caseId:
          type: string
        reasonCode:
          type: string
        status:
          type: string
          enum:
          - submitted
          - accepted
          - rejected
    AmlHandoffCreate:
      type: object
      required:
      - caseId
      - reasonCode
      properties:
        caseId:
          type: string
        reasonCode:
          type: string
    DataEnvelopeScoreEvent:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/ScoreEvent'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeScoreEvent:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ScoreEvent'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    DataEnvelopeCase:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/Case'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeCase:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Case'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    DataEnvelopeDisposition:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/Disposition'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeDisposition:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Disposition'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    DataEnvelopeEntityLink:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/EntityLink'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeEntityLink:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/EntityLink'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    DataEnvelopeModelVersion:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/ModelVersion'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeModelVersion:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ModelVersion'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    DataEnvelopeChallengerExperiment:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/ChallengerExperiment'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeChallengerExperiment:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ChallengerExperiment'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    DataEnvelopeAmlHandoff:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/AmlHandoff'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeAmlHandoff:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AmlHandoff'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
